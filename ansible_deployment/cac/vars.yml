---
# =============================================================================
# AAP Configuration as Code — Intelligent Cert Rotation Demo
# =============================================================================
# Defines all AAP Controller + EDA objects for the cert rotation workflow.
# Includes SNOW integration, Vault credentials, and cert-specific job templates.

# -----------------------------------------------------------------------------
# Custom Credential Types
# -----------------------------------------------------------------------------
controller_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for ITSM API"
    kind: cloud
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

  - name: "AO Webhook Credential"
    description: "OAuth2 service account for Automation Orchestrator EDA trigger"
    kind: cloud
    inputs:
      fields:
        - id: webhook_base_url
          type: string
          label: "AO Base URL"
        - id: webhook_client_id
          type: string
          label: "Service Account Client ID"
        - id: webhook_client_secret
          type: string
          label: "Service Account Client Secret"
          secret: true
    injectors:
      extra_vars:
        webhook_base_url: !unsafe "{{ webhook_base_url }}"
        webhook_client_id: !unsafe "{{ webhook_client_id }}"
        webhook_client_secret: !unsafe "{{ webhook_client_secret }}"

  - name: "AO API Credential"
    description: "Service account for Automation Orchestrator REST API (approval bridge)"
    kind: cloud
    inputs:
      fields:
        - id: ao_sa_client_id
          type: string
          label: "AO Service Account Client ID"
        - id: ao_sa_client_secret
          type: string
          label: "AO Service Account Client Secret"
          secret: true
        - id: ao_base_url
          type: string
          label: "AO API Base URL"
          help_text: "Internal or external URL for the AO API (e.g. https://ao.example.com)"
    injectors:
      extra_vars:
        ao_sa_client_id: !unsafe "{{ ao_sa_client_id }}"
        ao_sa_client_secret: !unsafe "{{ ao_sa_client_secret }}"
        ao_base_url: !unsafe "{{ ao_base_url }}"

  - name: "Vault Credential"
    description: "HashiCorp Vault credentials for certificate issuance via PKI engine"
    kind: cloud
    inputs:
      fields:
        - id: vault_addr
          type: string
          label: "Vault Address"
          help_text: "e.g. http://vault-host:8200"
        - id: vault_token
          type: string
          label: "Vault Token"
          secret: true
    injectors:
      env:
        VAULT_ADDR: !unsafe "{{ vault_addr }}"
        VAULT_TOKEN: !unsafe "{{ vault_token }}"

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "ServiceNow ITSM"
    description: "ServiceNow instance for incident and change request management"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow operations"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "AO Webhook"
    description: "OAuth2 credentials for AO EDA trigger endpoint"
    organization: "Default"
    credential_type: "AO Webhook Credential"
    inputs:
      webhook_base_url: "{{ ao_webhook_base_url }}"
      webhook_client_id: "{{ ao_webhook_client_id }}"
      webhook_client_secret: "{{ ao_webhook_client_secret }}"

  - name: "AO API"
    description: "Service account for AO approval bridge (uses webhook credentials)"
    organization: "Default"
    credential_type: "AO API Credential"
    inputs:
      ao_sa_client_id: "{{ ao_webhook_client_id }}"
      ao_sa_client_secret: "{{ ao_webhook_client_secret }}"
      ao_base_url: "{{ ao_webhook_base_url }}"

  - name: "Citizen Digital Service SSH"
    description: "SSH key for cert demo EC2 host (citizen-portal-web, citizen-portal-api)"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ demo_ssh_key }}"

  - name: "Vault"
    description: "HashiCorp Vault for certificate issuance from PKI engine"
    organization: "Default"
    credential_type: "Vault Credential"
    inputs:
      vault_addr: "{{ vault_addr }}"
      vault_token: "{{ vault_token }}"

  - name: "AWS"
    description: "AWS credentials for EC2 dynamic inventory"
    organization: "Default"
    credential_type: "Amazon Web Services"
    inputs:
      username: "{{ aws_access_key_id }}"
      password: "{{ aws_secret_access_key }}"

# -----------------------------------------------------------------------------
# Inventories
# -----------------------------------------------------------------------------
controller_inventories:
  - name: "Cert Demo Inventory"
    description: "AWS EC2 dynamic inventory for cert rotation demo hosts"
    organization: "Default"

# -----------------------------------------------------------------------------
# Inventory Sources (AWS EC2 dynamic discovery)
# -----------------------------------------------------------------------------
controller_inventory_sources:
  - name: "AWS EC2 - Cert Demo"
    description: "Discovers demo VM by tag:Name=ao-demo in eu-west-1"
    organization: "Default"
    inventory: "Cert Demo Inventory"
    source: scm
    source_project: "Cert Rotation Demo"
    source_path: "inventory/aws_ec2.yml"
    credential: "AWS"
    overwrite: true
    update_on_launch: true
    update_cache_timeout: 60

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "Cert Rotation Demo"
    description: "Playbooks and rulebooks for intelligent cert rotation workflow"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

# -----------------------------------------------------------------------------
# Job Templates
# -----------------------------------------------------------------------------
controller_templates:
  # ── Existing reusable templates ──────────────────────────────
  - name: "AO Workflow Bridge"
    description: >-
      EDA-to-AO bridge: obtains OAuth2 token from Automation Orchestrator
      and POSTs the event payload to the AO EDA trigger endpoint.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/trigger_ao_workflow.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "AO Webhook"

  - name: "Manage SNOW Incident"
    description: >-
      All ServiceNow incident operations: create, update, resolve.
      Pass action=create|update|resolve in extra_vars.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/manage_snow_incident.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow ITSM"

  - name: "Manage SNOW Change Request"
    description: >-
      All ServiceNow CR operations: create, authorize, update, review, close.
      Pass action=create|authorize|update|review|close in extra_vars.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/manage_snow_change_request.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow ITSM"

  - name: "Bridge AO Approval"
    description: >-
      Bridges ServiceNow CR approval to AO. Authenticates with AO API,
      finds pending approval by CR number, approves via PATCH.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/bridge_ao_approval.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "AO API"

  # ── Cert rotation templates ──────────────────────────────────
  - name: "Renew Certificate"
    description: >-
      Renews a PEM certificate from Vault CA, installs it for nginx,
      and reloads the service. Publishes renewal_status and new_expiry.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/renew_certificate.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "Citizen Digital Service SSH"
      - "Vault"

  - name: "Renew Keystore Certificate"
    description: >-
      Renews a Java keystore certificate from Vault CA for the API server,
      updates the keystore, and restarts Tomcat. Publishes renewal_status
      and new_expiry.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/renew_keystore_certificate.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "Citizen Digital Service SSH"
      - "Vault"

  - name: "Validate Cert Renewal"
    description: >-
      Validates a TLS certificate after renewal. Runs OpenSSL TLS
      handshake check and reports subject, issuer, expiry, days remaining.
    organization: "Default"
    job_type: "run"
    project: "Cert Rotation Demo"
    playbook: "playbooks/validate_certificate.yml"
    inventory: "Cert Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "Citizen Digital Service SSH"

# =============================================================================
# Event-Driven Ansible
# =============================================================================

# -----------------------------------------------------------------------------
# EDA Credential Types
# -----------------------------------------------------------------------------
eda_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for EDA source plugins"
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

# -----------------------------------------------------------------------------
# EDA Decision Environments
# -----------------------------------------------------------------------------
eda_decision_environments:
  - name: "ServiceNow DE"
    description: "Decision environment with servicenow.itsm for SNOW CR approval bridge"
    organization: "Default"
    image_url: "{{ de_image }}"

# -----------------------------------------------------------------------------
# EDA Projects
# -----------------------------------------------------------------------------
eda_projects:
  - name: "Cert Rotation Demo"
    description: "EDA rulebooks for cert alert listening and SNOW CR approval bridging"
    organization: "Default"
    url: "{{ git_repo_url }}"
    wait: true

# -----------------------------------------------------------------------------
# EDA Credentials
# -----------------------------------------------------------------------------
eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch job templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: false

  - name: "Splunk Cert Alerts Token"
    description: "Token auth for Splunk cert alert webhook events"
    credential_type: "Token Event Stream"
    organization: "Default"
    inputs:
      auth_type: token
      token: "{{ eda_event_stream_token }}"
      http_header_key: Authorization

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for EDA records source plugin (CR polling)"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

# -----------------------------------------------------------------------------
# EDA Event Streams
# -----------------------------------------------------------------------------
eda_event_streams:
  - name: "Splunk Cert Alerts"
    organization: "Default"
    credential_name: "Splunk Cert Alerts Token"
    event_stream_type: token
    forward_events: true
    test_mode: false

# -----------------------------------------------------------------------------
# Rulebook Activations
# -----------------------------------------------------------------------------
eda_rulebook_activations:
  - name: "cert-rotation"
    description: "Cert alert listener (via event stream) + SNOW CR approval bridge"
    organization: "Default"
    project: "Cert Rotation Demo"
    rulebook: "cert_rotation_rulebook.yml"
    decision_environment: "ServiceNow DE"
    enabled: true
    extra_vars:
      webhook_path: "{{ ao_webhook_path }}"
    event_streams:
      - event_stream: "Splunk Cert Alerts"
        source_name: "splunk_cert_alerts"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
