---
- name: Apply AAP objects — AO Baseline Template
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - infra.aap_configuration

  vars:
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') | default(omit, true) }}"
    aap_token: "{{ lookup('env', 'AAP_TOKEN') | default(omit, true) }}"
    aap_validate_certs: "{{ (lookup('env', 'AAP_VALIDATE_CERTS') | default('false', true)) | bool }}"

    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ aap_token }}"
    controller_validate_certs: "{{ aap_validate_certs }}"

    aap_configuration_secure_logging: false
    aap_configuration_collect_logs: true
    aap_configuration_async_retries: 60
    aap_configuration_async_delay: 5

    # ServiceNow (supports both SN_ and SERVICENOW_ env var naming)
    sn_instance: "{{ lookup('env', 'SERVICENOW_INSTANCE_URL') | default(lookup('env', 'SN_INSTANCE'), true) | default(omit, true) }}"
    sn_username: "{{ lookup('env', 'SERVICENOW_USERNAME') | default(lookup('env', 'SN_USERNAME'), true) | default(omit, true) }}"
    sn_password: "{{ lookup('env', 'SERVICENOW_PASSWORD') | default(lookup('env', 'SN_PASSWORD'), true) | default(omit, true) }}"

    # AO Webhook (EDA-to-AO bridge)
    ao_webhook_base_url: "{{ lookup('env', 'AO_WEBHOOK_BASE_URL') | default(omit, true) }}"
    ao_webhook_path: "{{ lookup('env', 'AO_WEBHOOK_PATH') | default('placeholder', true) }}"
    ao_webhook_client_id: "{{ lookup('env', 'AO_WEBHOOK_CLIENT_ID') | default('placeholder', true) }}"
    ao_webhook_client_secret: "{{ lookup('env', 'AO_WEBHOOK_CLIENT_SECRET') | default('placeholder', true) }}"

    # AO API Service Account (for approval bridge)
    ao_sa_client_id: "{{ lookup('env', 'AO_SA_CLIENT_ID') | default('placeholder', true) }}"
    ao_sa_client_secret: "{{ lookup('env', 'AO_SA_CLIENT_SECRET') | default('placeholder', true) }}"
    ao_base_url: "{{ lookup('env', 'AO_WEBHOOK_BASE_URL') | default(omit, true) }}"

    # Demo host SSH key (EC2 instance provisioned by Terraform)
    # Use absolute path to avoid playbook_dir resolution issues
    _repo_root: "{{ playbook_dir + '/../..' }}"
    demo_ssh_key_path: "{{ lookup('env', 'DEMO_SSH_KEY_PATH') | default(_repo_root + '/setup/terraform/demo-key.pem', true) }}"
    demo_ssh_key: "{{ lookup('file', demo_ssh_key_path) }}"

    # GitHub (for AAP project SCM URL)
    github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('YOUR_ORG/ao-cert-rotation', true) }}"
    git_repo_url: "{{ 'https://github.com/' ~ github_repo ~ '.git' }}"

    # EDA custom Decision Environment image
    de_image: "{{ lookup('env', 'DE_IMAGE') | default('YOUR_REGISTRY/snow-de:latest', true) }}"

    # Cert demo — Vault credentials
    cert_domain: "{{ lookup('env', 'CERT_DOMAIN') | default('certdemo.demoredhat.com', true) }}"
    vault_addr: "http://{{ lookup('env', 'DEMO_HOST_IP') | default('127.0.0.1', true) }}:8200"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('demo-root-token', true) }}"

    # AWS credentials (for EC2 dynamic inventory in AAP)
    aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('placeholder', true) }}"
    aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('placeholder', true) }}"

  vars_files:
    - vars.yml
  roles:
    - role: infra.aap_configuration.dispatch

  post_tasks:
    - name: Look up rulebook activations
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/activations/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
      register: _activations_response

    - name: Enable disabled rulebook activations
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/activations/{{ item.id }}/enable/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [204, 200, 409]
      loop: "{{ _activations_response.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      when: not item.is_enabled | default(true)
