---
# Master setup playbook for the cert rotation demo.
#
# Runs all provisioning playbooks in sequence:
#   1. provision_vm.yml    — nginx + Vault + initial certs
#   2. provision_tomcat.yml — Java/Tomcat + keystore cert
#   3. provision_splunk.yml — Splunk + cert monitoring + cron
#
# Usage:
#   ansible-playbook -i setup/playbooks/inventory/hosts.yml setup/playbooks/setup_demo_host.yml
#
# Or run each playbook individually for troubleshooting.

- name: "Phase 1: Provision nginx + Vault"
  ansible.builtin.import_playbook: provision_vm.yml

- name: "Phase 2: Provision Tomcat + Java Keystore"
  ansible.builtin.import_playbook: provision_tomcat.yml

- name: "Phase 3: Provision Splunk + Cert Monitoring"
  ansible.builtin.import_playbook: provision_splunk.yml
