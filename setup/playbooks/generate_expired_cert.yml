---
# Generate near-expiry certificates for demo reset.
#
# Usage:
#   ansible-playbook -i setup/playbooks/inventory/hosts.yml setup/playbooks/generate_expired_cert.yml
#   ansible-playbook ... --tags pem         # nginx only
#   ansible-playbook ... --tags keystore    # Tomcat only

- name: Generate Near-Expiry Certificates (Demo Reset)
  hosts: all
  become: true
  gather_facts: true

  vars:
    cert_domain: "{{ lookup('env', 'CERT_DOMAIN') | default('certdemo.demoredhat.com', true) }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('demo-root-token', true) }}"
    vault_addr: "http://127.0.0.1:8200"
    near_expiry_ttl: "120h"
    keystore_path: /opt/tomcat/conf/keystore.jks
    keystore_password: changeit

  tasks:
    # ── PEM cert (nginx) ────────────────────────────────────────
    - name: Expire PEM certificate (nginx)
      tags: [pem, always_show]
      block:
        - name: Issue near-expiry PEM certificate
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/pki/issue/cert-demo"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_token }}"
            body_format: json
            body:
              common_name: "{{ cert_domain }}"
              ttl: "{{ near_expiry_ttl }}"
              ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
            return_content: true
          register: nginx_cert

        - name: Install near-expiry nginx certificate
          ansible.builtin.copy:
            content: "{{ nginx_cert.json.data.certificate }}"
            dest: /etc/pki/tls/certs/server.crt
            mode: "0644"

        - name: Install near-expiry nginx key
          ansible.builtin.copy:
            content: "{{ nginx_cert.json.data.private_key }}"
            dest: /etc/pki/tls/private/server.key
            mode: "0600"

        - name: Reload nginx
          ansible.builtin.systemd:
            name: nginx
            state: reloaded

        - name: Show PEM result
          ansible.builtin.debug:
            msg: "nginx PEM cert now expires in ~5 days"

    # ── Keystore cert (Tomcat) ──────────────────────────────────
    - name: Expire keystore certificate (Tomcat)
      tags: [keystore, always_show]
      block:
        - name: Issue near-expiry keystore certificate
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/pki/issue/cert-demo"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_token }}"
            body_format: json
            body:
              common_name: "{{ cert_domain }}"
              ttl: "{{ near_expiry_ttl }}"
              ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
            return_content: true
          register: tomcat_cert

        - name: Save temp PEM files
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - { content: "{{ tomcat_cert.json.data.certificate }}", dest: "/tmp/api-server.crt", mode: "0644" }
            - { content: "{{ tomcat_cert.json.data.private_key }}", dest: "/tmp/api-server.key", mode: "0600" }

        - name: Create PKCS12 bundle
          ansible.builtin.command:
            cmd: >
              openssl pkcs12 -export
              -in /tmp/api-server.crt -inkey /tmp/api-server.key
              -out /tmp/api-server.p12 -name tomcat
              -passout pass:{{ keystore_password }}
          changed_when: true

        - name: Remove existing keystore
          ansible.builtin.file:
            path: "{{ keystore_path }}"
            state: absent

        - name: Import PKCS12 into keystore
          ansible.builtin.command:
            cmd: >
              keytool -importkeystore
              -srckeystore /tmp/api-server.p12 -srcstoretype PKCS12
              -srcstorepass {{ keystore_password }}
              -destkeystore {{ keystore_path }} -deststoretype JKS
              -deststorepass {{ keystore_password }} -alias tomcat -noprompt
          changed_when: true

        - name: Get CA cert
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/pki/ca/pem"
            return_content: true
          register: ca_cert

        - name: Import CA cert into keystore
          ansible.builtin.command:
            cmd: >
              keytool -importcert -keystore {{ keystore_path }}
              -storepass {{ keystore_password }} -alias vault-ca
              -file /tmp/vault-ca.pem -noprompt
          changed_when: true

        - name: Save CA cert
          ansible.builtin.copy:
            content: "{{ ca_cert.content }}"
            dest: /tmp/vault-ca.pem
            mode: "0644"

        - name: Set keystore ownership
          ansible.builtin.file:
            path: "{{ keystore_path }}"
            owner: tomcat
            group: tomcat
            mode: "0640"

        - name: Restart Tomcat
          ansible.builtin.systemd:
            name: tomcat
            state: restarted

        - name: Clean up temp files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: [/tmp/api-server.crt, /tmp/api-server.key, /tmp/api-server.p12, /tmp/vault-ca.pem]

        - name: Show keystore result
          ansible.builtin.debug:
            msg: "Tomcat keystore cert now expires in ~5 days"
