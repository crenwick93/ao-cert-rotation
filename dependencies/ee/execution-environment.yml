---
# Execution Environment for AAP job templates.
#
# Includes servicenow.itsm (for incident/CR management playbooks)
# and ansible.controller (for controller API operations).
#
# Build with:
#   ansible-builder build -f dependencies/ee/execution-environment.yml -t your-registry/ao-ee:latest
#
# Push with:
#   podman push your-registry/ao-ee:latest

version: 3

dependencies:
  galaxy:
    collections:
      - name: servicenow.itsm
      - name: ansible.controller
      - name: community.crypto
      - name: containers.podman
      - name: ansible.posix
  system:
    - pkgconf-pkg-config [platform:rpm]
    - systemd-devel [platform:rpm]
    - gcc [platform:rpm]
    - python3.11-devel [platform:rpm]

options:
  package_manager_path: /usr/bin/microdnf

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest
