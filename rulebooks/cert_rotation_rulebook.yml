---
# EDA rulebook for the cert rotation demo.
#
# Rule 1: Webhook listener — receives Splunk cert expiry alerts and triggers
#          the AO cert lifecycle workflow via the bridge playbook.
#
# Rule 2: SNOW CR polling — monitors ServiceNow change requests and bridges
#          CR approval to the AO approval gate when a CR moves to Implement.

# ─── Rule 1: Splunk Cert Alert → AO Workflow ─────────────────────────────────
- name: Cert Expiry Alert Listener
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Splunk cert alert received — trigger AO workflow
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - payload.host
          - payload.service
      condition: event.payload.cert_type is defined and event.payload.days_remaining is defined
      action:
        run_job_template:
          name: AO Workflow Bridge
          organization: Default
          post_events: true
          job_args:
            extra_vars:
              webhook_path: "{{ webhook_path }}"
              event_payload:
                host: "{{ event.payload.host }}"
                service: "{{ event.payload.service }}"
                cert_type: "{{ event.payload.cert_type }}"
                port: "{{ event.payload.port | default(443) }}"
                status: "{{ event.payload.status | default('critical') }}"
                days_remaining: "{{ event.payload.days_remaining }}"
                expiry_date: "{{ event.payload.expiry_date | default('') }}"
                issuer: "{{ event.payload.issuer | default('') }}"

# ─── Rule 2: ServiceNow CR Approval Bridge ───────────────────────────────────
- name: Cert Rotation — CR Approval Bridge
  hosts: all
  sources:
    - servicenow.itsm.records:
        table: change_request
        interval: 10
        remote_servicenow_timezone: "Europe/London"
        sysparm_query: >
          ORDERBYDESCsys_updated_on^ORDERBYDESCsys_id^short_descriptionLIKECertificate renewal
      filters:
        - ansible.eda.json_filter:
        - ansible.eda.normalize_keys:
  rules:
    - name: CR moved to Implement — bridge approval to AO
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - sys_id
      # state == '-1' is the Implement state in ServiceNow
      condition: event.state == '-1'
      action:
        run_job_template:
          name: Bridge AO Approval
          organization: Default
          job_args:
            extra_vars:
              cr_number: "{{ event.number }}"
              cr_sys_id: "{{ event.sys_id }}"
              cr_short_description: "{{ event.short_description }}"
