---
# Renew a Java keystore certificate from Vault CA for the API server.
#
# Requests a new certificate from Vault's PKI engine, builds a PKCS12
# bundle, imports it into the Java keystore, and restarts Tomcat.
# Publishes renewal status and new expiry via set_stats.
#
# Usage from AO workflow extra_vars:
#   { "cert_domain": "certdemo.demoredhat.com", "cert_host": "demo-vm" }
#
# Vault credentials are injected by the "Vault Credential" credential type.

- name: Renew Java Keystore Certificate (API Server)
  hosts: all
  become: true
  gather_facts: true

  vars:
    cert_domain: "{{ lookup('env', 'CERT_DOMAIN') | default('certdemo.demoredhat.com', true) }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://127.0.0.1:8200', true) }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('demo-root-token', true) }}"
    vault_pki_role: "cert-demo"
    cert_ttl: "2160h"
    keystore_path: /opt/tomcat/conf/keystore.jks
    keystore_password: changeit

  tasks:
    - name: Request new certificate from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/issue/{{ vault_pki_role }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          common_name: "{{ cert_domain }}"
          ttl: "{{ cert_ttl }}"
          ip_sans: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] | default(ansible_host) | default(cert_domain) }},127.0.0.1"
        return_content: true
        status_code: [200]
      register: cert_result

    - name: Get CA certificate from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/ca/pem"
        method: GET
        return_content: true
        status_code: [200]
      register: ca_cert

    - name: Save temporary PEM files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { content: "{{ cert_result.json.data.certificate }}", dest: "/tmp/api-server.crt", mode: "0644" }
        - { content: "{{ cert_result.json.data.private_key }}", dest: "/tmp/api-server.key", mode: "0600" }
        - { content: "{{ ca_cert.content }}", dest: "/tmp/vault-ca.pem", mode: "0644" }

    - name: Create PKCS12 bundle from new cert + key
      ansible.builtin.command:
        cmd: >
          openssl pkcs12 -export
          -in /tmp/api-server.crt
          -inkey /tmp/api-server.key
          -out /tmp/api-server.p12
          -name tomcat
          -passout pass:{{ keystore_password }}
      changed_when: true

    - name: Remove existing keystore
      ansible.builtin.file:
        path: "{{ keystore_path }}"
        state: absent

    - name: Import PKCS12 into Java keystore
      ansible.builtin.command:
        cmd: >
          keytool -importkeystore
          -srckeystore /tmp/api-server.p12
          -srcstoretype PKCS12
          -srcstorepass {{ keystore_password }}
          -destkeystore {{ keystore_path }}
          -deststoretype JKS
          -deststorepass {{ keystore_password }}
          -alias tomcat
          -noprompt
      changed_when: true

    - name: Import CA cert into keystore
      ansible.builtin.command:
        cmd: >
          keytool -importcert
          -keystore {{ keystore_path }}
          -storepass {{ keystore_password }}
          -alias vault-ca
          -file /tmp/vault-ca.pem
          -noprompt
      changed_when: true

    - name: Set keystore ownership
      ansible.builtin.file:
        path: "{{ keystore_path }}"
        owner: tomcat
        group: tomcat
        mode: "0640"

    - name: Restart Tomcat to pick up new keystore
      ansible.builtin.systemd:
        name: tomcat
        state: restarted

    - name: Clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/api-server.crt
        - /tmp/api-server.key
        - /tmp/api-server.p12
        - /tmp/vault-ca.pem

    - name: Wait for Tomcat to come up
      ansible.builtin.wait_for:
        port: 8443
        timeout: 30

    - name: Extract new expiry date
      ansible.builtin.shell:
        cmd: >
          echo | openssl s_client -connect localhost:8443 -servername {{ cert_domain }} 2>/dev/null
          | openssl x509 -noout -enddate | cut -d= -f2
      register: new_expiry
      changed_when: false

    - name: Display renewal result
      ansible.builtin.debug:
        msg: |
          === Java Keystore Certificate Renewed ===
          Domain: {{ cert_domain }}
          Service: api-server (:8443)
          New Expiry: {{ new_expiry.stdout }}
          Keystore: {{ keystore_path }}

    - name: Publish renewal artifacts
      ansible.builtin.set_stats:
        data:
          renewal_status: "success"
          renewal_service: "api-server"
          renewal_cert_type: "java_keystore"
          new_expiry: "{{ new_expiry.stdout }}"
          cert_domain: "{{ cert_domain }}"
          renewal_job_id: "{{ lookup('env', 'JOB_ID') | default('unknown') }}"
        aggregate: false
