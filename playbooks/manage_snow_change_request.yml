---
# Unified ServiceNow change request management playbook.
# Handles all CR lifecycle operations via the `action` variable.
#
# Actions:
#   create    — Create emergency CR with justification, impl/backout/test plans.
#               Publishes cr_sys_id and cr_number via set_stats.
#   authorize — Move CR to authorize state and request approval.
#   update    — Add work notes to an existing CR.
#   review    — Move CR to review state.
#   close     — Close the CR.
#
# Usage from AO workflow extra_vars:
#   { "action": "create", "short_description": "...", "justification": "..." }
#   { "action": "authorize", "cr_number": "..." }
#   { "action": "update", "cr_sys_id": "...", "work_notes": "..." }
#   { "action": "review", "cr_sys_id": "..." }
#   { "action": "close", "cr_sys_id": "..." }

- name: Manage ServiceNow Change Request
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - action is defined
          - action in ['create', 'create_standard', 'authorize', 'update', 'review', 'close']
        fail_msg: "action must be one of: create, create_standard, authorize, update, review, close"

    # =========================================================================
    # ACTION: create (emergency — legacy, kept for backwards compatibility)
    # =========================================================================
    - name: Create emergency Change Request
      servicenow.itsm.change_request:
        type: emergency
        state: new
        short_description: "{{ short_description }}"
        description: "{{ description | default(omit) }}"
        priority: "{{ cr_priority | default(1) }}"
        risk: "{{ cr_risk | default('low') }}"
        impact: "{{ cr_impact | default(2) }}"
        category: "{{ cr_category | default('Software') }}"
        assignment_group: "{{ cr_assignment_group | default('CAB Approval') }}"
        other:
          parent: "{{ inc_sys_id | default(omit) }}"
          justification: "{{ justification | default('Automated remediation — see description for details.') }}"
          implementation_plan: "{{ implementation_plan | default('Automated by Ansible Automation Platform and Automation Orchestrator.') }}"
          backout_plan: "{{ backout_plan | default('Investigate failure in AAP job output. Rollback manually if needed.') }}"
          test_plan: "{{ test_plan | default('Automated post-checks will verify service health and system state.') }}"
      register: cr_result
      when: action == 'create'

    - name: Display created CR
      ansible.builtin.debug:
        msg: |
          === Emergency Change Request Created ===
          Number: {{ cr_result.record.number }}
          Sys ID: {{ cr_result.record.sys_id }}
      when: action == 'create'

    - name: Publish CR identifiers (emergency)
      ansible.builtin.set_stats:
        data:
          cr_sys_id: "{{ cr_result.record.sys_id }}"
          cr_number: "{{ cr_result.record.number }}"
        aggregate: false
      when: action == 'create'

    # =========================================================================
    # ACTION: create_standard
    # Creates a standard change from a change template. Templates define the
    # approval policy, plans, and risk — the playbook fills in the specifics.
    # =========================================================================
    - name: Validate create_standard parameters
      ansible.builtin.assert:
        that:
          - short_description is defined
        fail_msg: "short_description must be provided for create_standard"
      when: action == 'create_standard'

    - name: Look up standard change template producer
      servicenow.itsm.api_info:
        resource: std_change_record_producer
        sysparm_query: "name={{ change_template_name }}"
        columns: "sys_id,name"
      register: template_lookup
      when:
        - action == 'create_standard'
        - change_template_id is not defined

    - name: Set template producer ID
      ansible.builtin.set_fact:
        _template_producer_id: "{{ change_template_id | default(template_lookup.record[0].sys_id) }}"
      when: action == 'create_standard'

    - name: Look up CMDB CI by name
      servicenow.itsm.configuration_item_info:
        name: "{{ cmdb_ci_name }}"
      register: ci_lookup
      when:
        - action == 'create_standard'
        - cmdb_ci_name is defined
        - cmdb_ci is not defined

    - name: Set CI sys_id
      ansible.builtin.set_fact:
        _cmdb_ci: "{{ cmdb_ci | default(ci_lookup.records[0].sys_id | default(omit)) }}"
      when: action == 'create_standard'

    - name: Create standard Change Request via REST API
      servicenow.itsm.api:
        api_path: /api/sn_chg_rest/change/standard/{{ _template_producer_id }}
        action: post
        data:
          short_description: "{{ short_description }}"
          description: "{{ description | default('') }}"
          assignment_group: "{{ cr_assignment_group | default('Platform Services') }}"
          cmdb_ci: "{{ _cmdb_ci | default(omit) }}"
      register: cr_std_result
      when: action == 'create_standard'

    - name: Display created standard CR
      ansible.builtin.debug:
        msg: |
          === Standard Change Request Created ===
          Number: {{ cr_std_result.record.number }}
          Sys ID: {{ cr_std_result.record.sys_id }}
          Type: Standard
      when: action == 'create_standard'

    - name: Publish CR identifiers (standard)
      ansible.builtin.set_stats:
        data:
          cr_sys_id: "{{ cr_std_result.record.sys_id }}"
          cr_number: "{{ cr_std_result.record.number }}"
        aggregate: false
      when: action == 'create_standard'

    # =========================================================================
    # ACTION: authorize
    # =========================================================================
    - name: Validate authorize parameters
      ansible.builtin.assert:
        that:
          - cr_number is defined
          - cr_number | length > 0
        fail_msg: "cr_number must be provided for authorize action"
      when: action == 'authorize'

    - name: Progress CR to Authorize and request approval
      servicenow.itsm.change_request:
        number: "{{ cr_number }}"
        state: authorize
        assignment_group: "{{ cr_assignment_group | default('CAB Approval') }}"
        other:
          approval: requested
          assigned_to: "{{ servicenow_approver | default('admin') }}"
      when: action == 'authorize'

    - name: Display authorize confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_number }} moved to Authorize — awaiting approval"
      when: action == 'authorize'

    # =========================================================================
    # ACTION: update
    # =========================================================================
    - name: Validate update parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
          - work_notes is defined
        fail_msg: "cr_sys_id and work_notes must be provided for update action"
      when: action == 'update'

    - name: Add work notes to CR
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        other:
          work_notes: "{{ work_notes }}"
      when: action == 'update'

    - name: Display update confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} updated with work notes"
      when: action == 'update'

    # =========================================================================
    # ACTION: review
    # =========================================================================
    - name: Validate review parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
        fail_msg: "cr_sys_id must be provided for review action"
      when: action == 'review'

    - name: Move CR to Review
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: review
        other:
          work_notes: "{{ work_notes | default('[AUTOMATED] Implementation complete — ready for review.') }}"
      when: action == 'review'

    - name: Display review confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} moved to Review"
      when: action == 'review'

    # =========================================================================
    # ACTION: close
    # =========================================================================
    - name: Validate close parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
        fail_msg: "cr_sys_id must be provided for close action"
      when: action == 'close'

    - name: Progress CR to Scheduled
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: scheduled
        assignment_group: "{{ cr_assignment_group | default('Platform Services') }}"
      when: action == 'close'
      ignore_errors: true

    - name: Progress CR to Implement
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: implement
        assignment_group: "{{ cr_assignment_group | default('Platform Services') }}"
        other:
          work_notes: "[code]<h3>Implementation</h3><p>Certificate renewal executed by Ansible Automation Platform.</p>[/code]"
      when: action == 'close'
      ignore_errors: true

    # ── Close change tasks before closing CR ────────────────────
    - name: Find change tasks for this CR
      servicenow.itsm.change_request_task_info:
        sysparm_query: "change_request={{ cr_sys_id }}^state!=3"
      register: open_tasks
      when: action == 'close'

    - name: Close implementation tasks
      servicenow.itsm.change_request_task:
        number: "{{ item.number }}"
        state: closed
        close_code: successful
        close_notes: "{{ task_close_summary | default('Completed successfully.') }}"
        assignment_group: "{{ cr_assignment_group | default('Platform Services') }}"
        other:
          description: "{{ task_descriptions[item.change_task_type | default(item.short_description | lower)] | default('Executed by Ansible Automation Platform.') }}"
      loop: "{{ open_tasks.records | default([]) }}"
      loop_control:
        label: "{{ item.number }} ({{ item.short_description | default('task') }})"
      when:
        - action == 'close'
        - item.state != '3'
      ignore_errors: true

    - name: Progress CR to Review
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: review
        assignment_group: "{{ cr_assignment_group | default('Platform Services') }}"
        other:
          work_notes: "[code]<h3>Post-Renewal Validation</h3><p>{{ close_notes | default('Validation passed.') | regex_replace('\n', '</p><p>') }}</p>[/code]"
      when: action == 'close'
      ignore_errors: true

    - name: Close CR
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: closed
        close_code: "{{ cr_close_code | default('successful') }}"
        close_notes: "{{ close_notes | default('Closed by automated workflow.') }}"
        assignment_group: "{{ cr_assignment_group | default('Platform Services') }}"
      when: action == 'close'

    - name: Display close confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} closed"
      when: action == 'close'
